[build-system]
requires=["setuptools>=68"]
build-backend= "setuptools.build_meta"

[project]
name = "desynthera"
version= "1.1"
description ="ETL pipeline and importer for Synthea datasets"
requires-python=">=3.11"
dependencies=[
    "polars>=1.0,<2.0",
    "pyarrow",
    "pyodbc"
]

[tool.setuptools.packages.find]
where=["src"]
include= ["etl*","importer*"]
namespaces =false
